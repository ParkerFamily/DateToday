<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open DateToday</title>
  <style>
    body { margin: 0; background: #09090B; color: #F5F3FF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 64px 24px; text-align: center; }
    .logo { font-size: 28px; font-weight: 800; margin-bottom: 28px; }
    .logo span { color: #A855F7; }
    p { color: #92929D; font-size: 16px; line-height: 24px; }
    a.btn { display: block; margin: 12px 0; padding: 15px 20px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    a.primary { background: linear-gradient(90deg, #7C3AED, #A855F7); color: #fff; }
    a.secondary { border: 1px solid #26242F; color: #F5F3FF; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Date<span>Today</span></div>
    <p>Opening DateToday…</p>
    <a class="btn primary" id="open" href="datetoday://">Open the app</a>
    <a class="btn secondary" href="https://apps.apple.com/app/id6810919273">Get it on the App Store</a>
    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.parkerfamily.datetoday">Get it on Google Play</a>
  </main>
  <script>
    (function () {
      var to = new URLSearchParams(location.search).get('to') || '/';
      if (!/^\/[A-Za-z0-9/_-]*$/.test(to)) to = '/';
      var url = 'datetoday:/' + to;
      document.getElementById('open').href = url;
      location.href = url;
    })();
  </script>
</body>
</html>
