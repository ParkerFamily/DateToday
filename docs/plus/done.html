<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#09090B">
  <title>DateToday+</title>
  <style>
    :root { --bg: #09090B; --line: #26242F; --text: #F5F3FF; --muted: #92929D; --brand: #7C3AED; --bright: #A855F7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% -10%, rgba(124,58,237,.35), transparent 60%), var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 440px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 20px 32px; text-align: center; }
    .logo { font-size: 22px; font-weight: 800; text-align: left; }
    .logo span { color: var(--bright); }
    .mark { width: 84px; height: 84px; margin: 56px auto 22px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; background: linear-gradient(135deg, var(--brand), var(--bright)); box-shadow: 0 16px 40px rgba(124,58,237,.45); }
    .mark.neutral { background: #1c1a24; box-shadow: none; border: 1px solid var(--line); }
    h1 { margin: 0 0 10px; font-size: 30px; line-height: 35px; letter-spacing: -.7px; font-weight: 900; }
    p { margin: 0; color: var(--muted); font-size: 16px; line-height: 23px; }
    .cta { display: block; margin-top: 28px; padding: 17px 20px; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--bright)); color: #fff; font-size: 17px; font-weight: 800; text-decoration: none; box-shadow: 0 10px 30px rgba(124,58,237,.35); }
    .fallback { margin-top: 18px; font-size: 13px; line-height: 19px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Date<span>Today</span></div>
    <div class="mark" id="mark">✓</div>
    <h1 id="title">You’re in.</h1>
    <p id="body">DateToday+ is active on your DateToday account.</p>
    <a class="cta" id="back" href="datetoday://checkout?status=success">Return to DateToday</a>
    <p class="fallback" id="fallback">App didn’t open? Open DateToday from your home screen — DateToday+ is already on your account.</p>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var status = q.get('status');
      var android = /Android/i.test(navigator.userAgent);
      var mobile = android || /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var $ = function (id) { return document.getElementById(id); };
      var copy = {
        success: ['You’re in.', 'DateToday+ is active on your DateToday account. Everything unlocks as soon as you’re back in the app.', '✓', 'success'],
        canceled: ['No charge made', 'Checkout was canceled. You can upgrade anytime from DateToday › DateToday+.', '←', 'canceled'],
        manage: ['All set', 'Your billing changes are saved.', '✓', 'manage'],
      }[status] || ['All set', 'You can go back to DateToday.', '←', 'closed'];
      $('title').textContent = copy[0];
      $('body').textContent = copy[1];
      $('mark').textContent = copy[2];
      if (status !== 'success') $('mark').className = 'mark neutral';
      try { sessionStorage.removeItem('dt.checkoutTicket'); } catch (e) {}
      $('back').href = android
        ? 'intent://checkout?status=' + copy[3] + '#Intent;scheme=datetoday;package=com.parkerfamily.datetoday;end'
        : 'datetoday://checkout?status=' + copy[3];
      if (!mobile) {
        $('back').hidden = true;
        $('fallback').textContent = 'You can close this tab and open DateToday on your phone.';
        return;
      }
      if (status === 'success') setTimeout(function () { location.href = $('back').href; }, 700);
    })();
  </script>
</body>
</html>
